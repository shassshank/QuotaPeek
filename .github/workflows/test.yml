name: Test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Swift tests
        run: swift test

      - name: Hook tests
        run: python3 -m unittest discover -s Tests/hooks

      - name: Shell scripts parse
        run: |
          for f in install.sh Scripts/*.sh; do bash -n "$f"; done
