name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: Backend/go.mod

      - name: Extract version from tag
        id: version
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          VERSION="${TAG#v}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build Go daemon
        run: |
          mkdir -p .build-go
          cd Backend
          GOOS=darwin GOARCH=arm64 go build -o ../.build-go/quotapeekd-arm64 .
          GOOS=darwin GOARCH=amd64 go build -o ../.build-go/quotapeekd-amd64 .
          cd ..
          lipo -create -output .build-go/quotapeekd .build-go/quotapeekd-arm64 .build-go/quotapeekd-amd64

      - name: Build Swift app
        run: |
          swift build -c release --arch arm64 --arch x86_64
          mkdir -p .build/release
          cp .build/apple/Products/Release/QuotaPeek .build/release/QuotaPeek

      - name: Assemble .app bundle and ad-hoc sign
        env:
          VERSION: ${{ steps.version.outputs.version }}
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          bash Scripts/build-app-bundle.sh \
            --version "$VERSION" \
            --build "$BUILD_NUMBER"

      - name: Package release tarball
        run: |
          STAGING="$(mktemp -d)"
          # App bundle
          cp -R .build/release/QuotaPeek.app "$STAGING/"
          # Daemon binary
          cp .build-go/quotapeekd "$STAGING/"
          # Hook scripts
          cp Scripts/claude-statusline-hook.py "$STAGING/"
          cp Scripts/antigravity-statusline-hook.py "$STAGING/"
          # Utility scripts
          cp Scripts/run-with-log-rotation.sh "$STAGING/"
          cp Scripts/uninstall.sh "$STAGING/"
          # LaunchAgent templates (install.sh --remote needs these)
          cp LaunchAgents/com.quotapeek.daemon.plist.template "$STAGING/"
          cp LaunchAgents/com.quotapeek.app.plist.template "$STAGING/"
          # Create tarball
          tar czf quotapeek-macos.tar.gz -C "$STAGING" .
          rm -rf "$STAGING"

      - name: Build DMG
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          bash Scripts/build-dmg.sh \
            --version "$VERSION"

      - name: Compute release checksums
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          shasum -a 256 quotapeek-macos.tar.gz > SHA256SUMS
          (cd .build/release && shasum -a 256 "QuotaPeek-${VERSION}.dmg") >> SHA256SUMS

      - name: Update Homebrew cask
        run: |
          TARBALL_SHA=$(grep 'quotapeek-macos\.tar\.gz' SHA256SUMS | awk '{print $1}')
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin master:refs/remotes/origin/master
          git checkout -B master origin/master
          python3 -c "
          import sys, re
          version, sha = sys.argv[1], sys.argv[2]
          path = 'Casks/quotapeek.rb'
          with open(path, 'r') as f:
              content = f.read()
          content = re.sub(r'\bversion \"[^\"]+\"', f'version \"{version}\"', content, count=1)
          content = re.sub(r'\bsha256 (:no_check|\"[^\"]*\")', f'sha256 \"{sha}\"', content, count=1)
          with open(path, 'w') as f:
              f.write(content)
          " "${{ steps.version.outputs.version }}" "$TARBALL_SHA"
          git add Casks/quotapeek.rb
          if ! git diff --cached --quiet; then
            git commit -m "chore(cask): update quotapeek cask to ${{ steps.version.outputs.tag }}"
            git push origin master
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65  # v2.6.2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: QuotaPeek ${{ steps.version.outputs.tag }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            quotapeek-macos.tar.gz
            .build/release/QuotaPeek-${{ steps.version.outputs.version }}.dmg
            SHA256SUMS
