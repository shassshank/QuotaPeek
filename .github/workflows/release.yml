name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # The cask step below rewrites Casks/quotapeek.rb on main. If the tag
      # isn't on main, main's cask (and install.sh) may not match this
      # release's tarball, so refuse before building anything.
      - name: Require the tag to be on main
        run: |
          git fetch origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main \
            || { echo "Tag $GITHUB_REF_NAME is not on main; merge first, then tag." >&2; exit 1; }

      - name: Extract version from tag
        id: version
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          VERSION="${TAG#v}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Run tests
        run: |
          swift test
          python3 -m unittest discover -s Tests/hooks

      - name: Build Swift app
        run: swift build -c release --arch arm64 --arch x86_64

      - name: Assemble .app bundle and ad-hoc sign
        env:
          VERSION: ${{ steps.version.outputs.version }}
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          # The universal build's output dir differs across Swift versions;
          # the app and widget binaries are both taken from it.
          BIN_DIR="$(swift build -c release --arch arm64 --arch x86_64 --show-bin-path)" \
            bash Scripts/build-app-bundle.sh \
            --version "$VERSION" \
            --build "$BUILD_NUMBER"
          test -x .build/release/QuotaPeek.app/Contents/PlugIns/QuotaPeekWidget.appex/Contents/MacOS/QuotaPeekWidget

      - name: Package release tarball
        run: |
          STAGING="$(mktemp -d)"
          # App bundle
          cp -R .build/release/QuotaPeek.app "$STAGING/"
          # Hook scripts and the module they share
          cp Scripts/claude-statusline-hook.py "$STAGING/"
          cp Scripts/antigravity-statusline-hook.py "$STAGING/"
          cp Scripts/quotapeek_hook.py "$STAGING/"
          # Utility scripts
          cp Scripts/run-with-log-rotation.sh "$STAGING/"
          cp Scripts/uninstall.sh "$STAGING/"
          # LaunchAgent template (install.sh --remote needs it)
          cp LaunchAgents/com.quotapeek.app.plist.template "$STAGING/"
          # Create tarball
          tar czf quotapeek-macos.tar.gz -C "$STAGING" .
          rm -rf "$STAGING"

      - name: Build DMG
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          bash Scripts/build-dmg.sh \
            --version "$VERSION"

      - name: Compute release checksums
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          shasum -a 256 quotapeek-macos.tar.gz > SHA256SUMS
          (cd .build/release && shasum -a 256 "QuotaPeek-${VERSION}.dmg") >> SHA256SUMS

      - name: Update Homebrew cask
        run: |
          TARBALL_SHA=$(grep 'quotapeek-macos\.tar\.gz' SHA256SUMS | awk '{print $1}')
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin main:refs/remotes/origin/main
          git checkout -B main origin/main
          python3 -c "
          import sys, re
          version, sha = sys.argv[1], sys.argv[2]
          path = 'Casks/quotapeek.rb'
          with open(path, 'r') as f:
              content = f.read()
          content = re.sub(r'\bversion \"[^\"]+\"', f'version \"{version}\"', content, count=1)
          content = re.sub(r'\bsha256 (:no_check|\"[^\"]*\")', f'sha256 \"{sha}\"', content, count=1)
          with open(path, 'w') as f:
              f.write(content)
          " "${{ steps.version.outputs.version }}" "$TARBALL_SHA"
          git add Casks/quotapeek.rb
          if ! git diff --cached --quiet; then
            git commit -m "chore(cask): update quotapeek cask to ${{ steps.version.outputs.tag }}"
            git push origin main
          fi

      # The annotated tag's message is the release notes; checkout only
      # fetched the commit, so pull the tag object itself to read it.
      - name: Release notes from tag
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          git fetch --force origin "refs/tags/$TAG:refs/tags/$TAG"
          git tag -l --format='%(contents)' "$TAG" > release-notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65  # v2.6.2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: QuotaPeek ${{ steps.version.outputs.tag }}
          draft: false
          prerelease: false
          body_path: release-notes.md
          files: |
            quotapeek-macos.tar.gz
            .build/release/QuotaPeek-${{ steps.version.outputs.version }}.dmg
            SHA256SUMS
